name: Faultline example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fixed-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Faultline and Chromium
        run: |
          python -m pip install -e '.[dev]'
          python -m playwright install --with-deps chromium
      - name: Start local target
        run: |
          python -m faultline serve > /tmp/faultline.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=1)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Local target did not start')
          PY
      - name: Hunt for confirmed failures
        run: >-
          python -m faultline hunt
          'http://127.0.0.1:8000/demo/checkout.html?mode=fixed'
          --planner heuristic --ci --junit artifacts/junit.xml
      - name: Retain evidence and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faultline-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
