[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline"
version = "0.2.0"
description = "Hypothesis-driven hunting for race conditions and lost-input bugs in web UIs: planned by Meta Muse, verified by Playwright."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "playwright>=1.49",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
faultline = "faultline.cli:main"

[tool.setuptools.packages.find]
include = ["faultline*"]

[tool.setuptools.package-data]
faultline = ["static/*", "demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
